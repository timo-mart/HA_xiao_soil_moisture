; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = seeed_xiao_esp32_c6

[battery_common]
build_flags =
            -DZIGBEE_MODE_ED
            -DCORE_DEBUG_LEVEL=5
            -D ARDUINO_USB_MODE=1
            -D ARDUINO_USB_CDC_ON_BOOT=1

[env:seeed_xiao_esp32_c6]
; Arduino-ESP32 4.0.0-RC1 uses ESP Zigbee SDK 2.x instead of ZBOSS.
platform = https://github.com/pioarduino/platform-espressif32/releases/download/61.04.00-RC1/platform-espressif32.zip
board = seeed_xiao_esp32c6
framework = arduino
monitor_speed = 115200
board_build.partitions = zigbee.csv
board_build.filesystem = spiffs
build_flags =
            ${battery_common.build_flags}
            -D BATTERY_CHEMISTRY=1

[env:seeed_xiao_esp32_c6_alkaline]
extends = env:seeed_xiao_esp32_c6
build_flags =
            ${battery_common.build_flags}
            -D BATTERY_CHEMISTRY=2
